<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Calistenia Pro — Programa de Calistenia Militar</title>
<meta name="description" content="Programa de calistenia militar de 63 días, 3 fases. Entrená con tu propio cuerpo, sin gimnasio, sin excusas.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111311">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
:root{
  --background:120 5% 7%; --foreground:80 10% 90%;
  --card:120 5% 10%; --card-foreground:80 10% 90%;
  --border:120 5% 18%; --muted:120 5% 14%; --muted-foreground:80 5% 55%;
  --secondary:120 8% 16%; --secondary-foreground:80 10% 85%;
  --primary:120 40% 40%; --primary-foreground:120 5% 7%;
  --accent:120 30% 22%; --destructive:0 62% 50%;
  --radius:.75rem;
}
/* Tema claro: se activa poniendo data-theme="light" en <html> (ver
   applyTheme() en app.js). Sin ese atributo (o con "dark") se usa el
   oscuro de arriba, que sigue siendo el default de toda la vida. */
html[data-theme="light"]{
  --background:100 20% 97%; --foreground:120 15% 12%;
  --card:0 0% 100%; --card-foreground:120 15% 12%;
  --border:120 10% 85%; --muted:120 15% 93%; --muted-foreground:120 6% 40%;
  --secondary:120 12% 92%; --secondary-foreground:120 15% 20%;
  --primary:120 45% 32%; --primary-foreground:0 0% 100%;
  --accent:120 25% 85%; --destructive:0 65% 45%;
}
html,body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));min-height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;margin:0}
p{margin:0}
button{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:76px}
#view{padding:20px 18px 32px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(420px) rotate(300deg);opacity:0}}

/* ===== primitives ===== */
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:6px;background:hsl(var(--secondary));color:hsl(var(--secondary-foreground))}
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);padding:18px}
.card-soft{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);padding:14px;cursor:pointer;transition:border-color .15s}
.card-soft:hover{border-color:hsla(var(--primary)/.5)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:var(--radius);font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.03em;font-size:15px;cursor:pointer;text-align:center;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:hsl(var(--primary));color:#fff;box-shadow:0 4px 16px -4px hsla(var(--primary)/.4)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));border:1px solid hsl(var(--border))}
.btn-ghost{background:none;color:hsl(var(--muted-foreground));border:none;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.radio-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius);background:hsla(var(--secondary)/.5);border:1px solid hsl(var(--border));cursor:pointer;margin-bottom:10px;transition:border-color .15s}
.radio-row:hover{border-color:hsla(var(--primary)/.4)}
.radio-row.sel{border-color:hsl(var(--primary));background:hsla(var(--primary)/.12)}
.radio-dot{width:16px;height:16px;border-radius:50%;border:2px solid hsl(var(--primary));flex:none;position:relative}
.radio-row.sel .radio-dot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:hsl(var(--primary))}
.chip{padding:6px 13px;border-radius:20px;border:1px solid hsl(var(--border));background:hsl(var(--secondary));font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.sel{background:hsl(var(--primary));color:#fff;border-color:hsl(var(--primary))}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:20px}
.pill.pendiente{background:hsl(var(--secondary));color:hsl(var(--muted-foreground))}
.pill.curso{background:hsla(var(--primary)/.18);color:hsl(var(--primary))}
.pill.completo{background:hsl(var(--primary));color:#fff}

/* ===== bottom nav ===== */
#bottomNav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;background:hsl(var(--card));border-top:1px solid hsl(var(--border));z-index:20}
.nav-link{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:11px;font-weight:700;letter-spacing:.03em;color:hsl(var(--muted-foreground))}
.nav-link .ic{font-size:20px}
.nav-link-active{color:hsl(var(--primary))}

/* ===== home ===== */
.hero-badge{display:flex;align-items:center;gap:8px;width:max-content;margin:0 auto 14px;padding:5px 13px;background:hsla(var(--primary)/.12);border:1px solid hsla(var(--primary)/.3);border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:hsl(var(--primary))}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--primary));animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.brand-h1{font-size:32px;font-weight:800;text-align:center;letter-spacing:.02em;color:hsl(var(--primary));text-transform:uppercase}
.brand-sub{text-align:center;color:hsl(var(--muted-foreground));font-size:14px;margin:6px 0 26px}
.quiz-icon{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;background:hsla(var(--primary)/.12);border:1px solid hsla(var(--primary)/.3)}
.quiz-title{font-size:19px;font-weight:700;text-align:center;text-transform:uppercase}
.quiz-sub{text-align:center;color:hsl(var(--muted-foreground));font-size:13px;margin:4px 0 18px}
.quiz-q{font-size:15.5px;font-weight:600;text-align:center;margin-bottom:14px}
.foot-note{text-align:center;color:hsl(var(--muted-foreground));font-size:12px;margin-top:22px}

/* ===== programa ===== */
.stat-block{text-align:center;margin:18px 0 24px}
.stat-pct{font-size:44px;font-weight:800;color:hsl(var(--primary));line-height:1}
.stat-sub{color:hsl(var(--muted-foreground));font-size:13px;margin-top:4px}
.progress-track{height:8px;background:hsl(var(--secondary));border-radius:8px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;background:hsl(var(--primary));transition:width .4s}
.phase-block{margin-bottom:24px}
.phase-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.phase-title{font-size:20px;font-weight:700;margin:4px 0 2px}
.phase-desc{color:hsl(var(--muted-foreground));font-size:13px;margin-bottom:6px}
.phase-meta{font-size:12px;color:hsl(var(--muted-foreground));margin-bottom:10px}
.week-head{font-size:12px;font-weight:700;letter-spacing:.08em;color:hsl(var(--primary));margin:14px 0 8px}
.day-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius);background:hsl(var(--card));border:1px solid hsl(var(--border));margin-bottom:8px;cursor:pointer}
.day-row.locked{opacity:.45;cursor:not-allowed}
.day-row.done{border-color:hsla(var(--primary)/.5)}
.day-num{width:34px;height:34px;border-radius:50%;background:hsl(var(--secondary));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.day-row.done .day-num{background:hsl(var(--primary));color:#fff}
.day-info{flex:1;min-width:0}
.day-title{font-weight:600;font-size:14.5px}
.day-min{color:hsl(var(--muted-foreground));font-size:12px}
.day-check{font-size:18px;color:hsl(var(--primary))}

/* ===== modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal-box{background:hsl(var(--card));border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:20px 18px 28px}
.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.video-wrap{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;margin-bottom:14px}
.video-wrap iframe{width:100%;height:100%;border:none}

/* ===== bonos ===== */
.bono-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);padding:14px;margin-bottom:12px;cursor:pointer}
.bono-num{width:38px;height:38px;border-radius:10px;background:hsla(var(--primary)/.15);color:hsl(var(--primary));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.bono-title{font-weight:700;font-size:14.5px;margin:3px 0 2px;color:hsl(var(--foreground))}
.bono-desc{color:hsl(var(--muted-foreground));font-size:12.5px}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.recipe-row{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);padding:14px;margin-bottom:10px}
.recipe-row h3{font-size:15px;font-weight:600;margin-top:4px}
.recipe-body{margin-top:12px;padding-top:12px;border-top:1px solid hsl(var(--border))}
.recipe-body h4{font-size:12px;letter-spacing:.06em;color:hsl(var(--primary));margin-bottom:6px}
.recipe-body ul{margin:0 0 12px;padding-left:18px;font-size:13.5px;line-height:1.6}
.recipe-body p{font-size:13.5px;line-height:1.55;margin-bottom:14px}
.recipe-actions{display:flex;gap:8px}
.recipe-actions .btn{flex:1;padding:10px;font-size:12.5px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;color:hsl(var(--muted-foreground));margin-bottom:6px;text-transform:uppercase}
.field input[type="number"], .field input[type="time"]{width:100%;padding:12px;border-radius:var(--radius);border:1px solid hsl(var(--border));background:hsl(var(--secondary));color:hsl(var(--foreground));font-size:15px;margin-bottom:16px}
.stat-row{display:flex;gap:10px;margin:16px 0}
.stat-box{flex:1;background:hsl(var(--secondary));border-radius:var(--radius);padding:14px;text-align:center}
.stat-box .v{font-size:22px;font-weight:800;color:hsl(var(--primary))}
.stat-box .l{font-size:11px;color:hsl(var(--muted-foreground));margin-top:2px}
.habit-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid hsl(var(--border))}
.habit-check{width:26px;height:26px;border-radius:7px;border:2px solid hsl(var(--border));display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.habit-check.on{background:hsl(var(--primary));border-color:hsl(var(--primary));color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.cal-dow{text-align:center;font-size:10px;color:hsl(var(--muted-foreground));font-weight:700}
.cal-day{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;background:hsl(var(--secondary));color:hsl(var(--muted-foreground))}
.cal-day.completo{background:hsl(var(--primary));color:#fff;font-weight:700}
.cal-day.parcial{background:hsla(var(--primary)/.35);color:hsl(var(--foreground))}
.cal-legend{display:flex;gap:14px;font-size:11px;color:hsl(var(--muted-foreground));margin-top:6px}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tabs-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}
.tab-btn{padding:8px 12px;border-radius:8px;background:hsl(var(--secondary));border:1px solid hsl(var(--border));font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab-btn.sel{background:hsl(var(--primary));color:#fff;border-color:hsl(var(--primary))}
.ingredient-list{list-style:none;padding:0;margin:10px 0}
.ingredient-list li{padding:6px 0;font-size:13.5px;border-bottom:1px dashed hsl(var(--border))}
.timeline-item{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.timeline-item .ic{font-size:18px}
.timeline-item .time{font-family:monospace;font-weight:700;color:hsl(var(--primary));font-size:13px}
.recovery-btn{display:block;width:100%;text-align:left;padding:14px;border-radius:var(--radius);background:hsl(var(--card));border:1px solid hsl(var(--border));margin-bottom:10px;cursor:pointer}
.recovery-btn b{display:block;font-size:14.5px;margin-bottom:2px}
.recovery-btn span{color:hsl(var(--muted-foreground));font-size:12.5px}
.recovery-btn.sel{border-color:hsl(var(--primary));background:hsla(var(--primary)/.1)}
.result-block{margin:16px 0}
.result-block h4{font-size:11.5px;letter-spacing:.05em;color:hsl(var(--primary));margin-bottom:5px;text-transform:uppercase}
.result-block p{font-size:14px;line-height:1.5}
.checklist-item{display:flex;align-items:center;gap:12px;padding:10px 0}
.checklist-item span{font-size:13.5px;flex:1}
.phase-pills{display:flex;gap:8px;margin-top:14px}
.phase-pill{flex:1;text-align:center;padding:8px;border-radius:8px;background:hsl(var(--secondary));font-size:11px;font-weight:700}
.phase-pill.active{background:hsl(var(--primary));color:#fff}
.mono-header{font-family:monospace;font-size:11px;color:hsl(var(--muted-foreground));letter-spacing:.03em;margin-bottom:4px}
.timer-circle{width:120px;height:120px;border-radius:50%;border:4px solid hsl(var(--primary));display:flex;align-items:center;justify-content:center;margin:16px auto;font-size:28px;font-weight:800;font-family:'Oswald'}

/* ===== info ===== */
.info-sec{margin-bottom:22px}
.info-sec h3{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:hsl(var(--primary));margin-bottom:8px}
.info-sec p{font-size:14px;line-height:1.55;color:hsl(var(--foreground))}
.info-sec ul{margin:0;padding-left:20px;font-size:14px;line-height:1.7}
.step-row{display:flex;gap:12px;margin-bottom:16px}
.step-num{width:28px;height:28px;border-radius:50%;background:hsl(var(--secondary));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.quote{text-align:center;font-style:italic;color:hsl(var(--muted-foreground));font-size:13.5px;margin-top:24px;padding:16px;border-top:1px solid hsl(var(--border))}

@media(min-width:521px){ #app{border-left:1px solid hsl(var(--border));border-right:1px solid hsl(var(--border))} body{background:hsl(var(--background))} }

/* ===== header (perfil + racha) ===== */
#topHeader{display:flex;align-items:center;gap:12px;padding:12px 18px;background:hsl(var(--card));border-bottom:1px solid hsl(var(--border));position:sticky;top:0;z-index:15}
.avatar-circle{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;background:hsl(var(--secondary));display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:2px solid hsl(var(--border))}
.avatar-circle img{width:100%;height:100%;object-fit:cover;display:block}
.top-header-name{flex:1;min-width:0}
.top-header-name b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-header-name span{font-size:11px;color:hsl(var(--muted-foreground))}
.streak-pill{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:20px;background:hsla(var(--primary)/.15);color:hsl(var(--primary));font-weight:800;font-size:13px;flex:none;border:none;cursor:pointer;font-family:inherit}
.gear-btn{width:34px;height:34px;border-radius:50%;border:1px solid hsl(var(--border));background:hsl(var(--secondary));display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;cursor:pointer}

/* ===== configuración ===== */
.seg-row{display:flex;gap:8px;margin-bottom:18px}
.seg-btn{flex:1;padding:10px;border-radius:var(--radius);border:1px solid hsl(var(--border));background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));font-size:13px;font-weight:700;cursor:pointer;text-align:center}
.seg-btn.sel{background:hsl(var(--primary));color:#fff;border-color:hsl(var(--primary))}
.lang-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid hsl(var(--border));cursor:pointer}
.lang-row:last-child{border-bottom:none}
.lang-row span{font-size:14px}
.lang-row .chk{color:hsl(var(--primary));font-weight:800}
.settings-label{font-size:12px;font-weight:700;letter-spacing:.05em;color:hsl(var(--muted-foreground));text-transform:uppercase;margin:18px 0 8px;text-align:left}

/* ===== onboarding / editar perfil ===== */
.avatar-picker{width:84px;height:84px;border-radius:50%;margin:0 auto 16px;background:hsl(var(--secondary));display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;border:2px dashed hsl(var(--border));overflow:hidden;position:relative}
.avatar-picker img{width:100%;height:100%;object-fit:cover;display:block}
.field input[type="text"]{width:100%;padding:12px;border-radius:var(--radius);border:1px solid hsl(var(--border));background:hsl(var(--secondary));color:hsl(var(--foreground));font-size:15px;margin-bottom:16px}

/* ===== logros ===== */
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 18px}
.badge-cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:hsl(var(--card));border:1px solid hsl(var(--border));cursor:pointer;text-align:center}
.badge-cell.locked{opacity:.35;filter:grayscale(1)}
.badge-ic{font-size:26px}
.badge-label{font-size:9.5px;font-weight:700;line-height:1.2}

/* ===== fotos de progreso ===== */
.photo-slot-row{display:flex;gap:10px;margin:14px 0}
.photo-slot{flex:1;aspect-ratio:3/4;border-radius:12px;border:1.5px dashed hsl(var(--border));background:hsl(var(--secondary));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;overflow:hidden;position:relative}
.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-slot .lbl{position:relative;z-index:1;font-size:11px;font-weight:700;color:hsl(var(--muted-foreground));text-align:center;padding:0 6px}
.photo-slot.filled .lbl{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);z-index:2;background:rgba(0,0,0,.55);color:#fff;padding:2px 8px;border-radius:10px;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="topHeader"></div>
  <main id="view"></main>
  <nav id="bottomNav">
    <a class="nav-link" data-path="/" href="/"><span class="ic">🏠</span>Home</a>
    <a class="nav-link" data-path="/programa" href="/programa"><span class="ic">📅</span>Programa</a>
    <a class="nav-link" data-path="/tu-plan" href="/tu-plan"><span class="ic">📄</span>Tu Plan</a>
    <a class="nav-link" data-path="/info" href="/info"><span class="ic">ℹ️</span>Info</a>
  </nav>
</div>

<script src="/config.js"></script>
<script src="/app.js"></script>
<script>
// Service Worker: deja la app usable sin conexión después de la primera
// visita (ver sw.js). Si el navegador no lo soporta, simplemente no hace
// nada — la app sigue funcionando igual, solo que necesita internet.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}
</script>
</body>
</html>
